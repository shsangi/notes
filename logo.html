<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pen Drawing Animation</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#1e293b; }
  svg  { width:min(70vw,260px); overflow:visible; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .ink { fill:none; stroke:#fff; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  #dot { fill:#fff; }
  #pen path { fill:#38bdf8; stroke:#fff; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; }
  #pen .line   { fill:none; }
  #pen circle  { fill:#fff; }
</style>
</head>
<body>

<svg id="s" viewBox="0 0 32 32">
  <path class="ink" d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
  <path class="ink" d="M12 19l7-7 3 3-7 7-3-3z"/>
  <path class="ink" d="M2 2l7.6 7.6"/>
  <circle id="dot" cx="11" cy="11" r="0"/>

  <!-- moving pen: same shape, nib at (2,2) -->
  <g id="pen" style="opacity:0">
    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
    <path class="line" d="M2 2l7.6 7.6"/>
    <circle cx="11" cy="11" r="2"/>
  </g>
</svg>

<script>
const SPEED = 5;     // drawing speed (units/sec): smaller = slower
const FLY   = 12;    // pen speed while lifted
const SCALE = 0.55;  // pen size

const svg     = document.getElementById('s');
const strokes = [...svg.querySelectorAll('.ink')];
const dot     = document.getElementById('dot');
const pen     = document.getElementById('pen');
const len     = strokes.map(p => p.getTotalLength());
strokes.forEach((p, i) => p.style.strokeDasharray = `${len[i]} ${len[i]}`);

const clamp = x => Math.min(1, Math.max(0, x));
const sine  = t => -(Math.cos(Math.PI * t) - 1) / 2;
const outC  = t => 1 - Math.pow(1 - t, 3);
const inOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const back  = t => { const c = 1.70158, d = c + 1; return 1 + d*Math.pow(t-1, 3) + c*Math.pow(t-1, 2); };

const start  = i => strokes[i].getPointAtLength(0);
const end    = i => strokes[i].getPointAtLength(len[i]);
const CENTER = { x: 11, y: 11 };
const dist   = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

// ---------- Timeline: one step after another, no gaps, no overlaps ----------
const segs = []; let T = 0;
const add = (dur, fn) => { segs.push({ s: T, e: T + dur, fn }); T += dur; };

const drawStroke = i => add(len[i] / SPEED, (k, o) => {
  const q = sine(k);                       // pen and ink use the same value
  const p = strokes[i].getPointAtLength(len[i] * q);
  o.drawn[i] = q; o.x = p.x; o.y = p.y; o.sc = SCALE; o.op = 1;
});

const fly = (A, B) => add(Math.max(.5, dist(A, B) / FLY), (k, o) => {
  const e = inOut(k), lift = Math.sin(Math.PI * k);
  o.x = A.x + (B.x - A.x) * e;
  o.y = A.y + (B.y - A.y) * e - lift * 2.5;
  o.sc = SCALE + .15 * lift;               // lifted pen looks closer
  o.op = 1;
});

const A0 = start(0);
add(.9, (k, o) => {                        // pen lands on the paper
  const e = outC(k);
  o.x = A0.x + (1 - e) * 6; o.y = A0.y - (1 - e) * 8;
  o.sc = SCALE + .3 * (1 - e); o.op = clamp(k * 3);
});
drawStroke(0);
fly(end(0), start(1));
drawStroke(1);
fly(end(1), start(2));
drawStroke(2);
fly(end(2), CENTER);
add(1.0, (k, o) => {                       // press down: ink dot spreads out
  o.x = 11; o.y = 11; o.op = 1;
  o.sc = SCALE - .05 * Math.sin(Math.PI * k);
  o.dot = clamp((k - .2) / .8);
});
add(1.0, (k, o) => {                       // pen lifts away
  const e = inOut(k);
  o.x = 11 + e * 3; o.y = 11 - e * 5;
  o.sc = SCALE + .25 * e; o.op = 1 - e * e; o.dot = 1;
});

// ---------- Render ----------
function render(t) {
  const o = { x: A0.x, y: A0.y, sc: SCALE, op: 0, dot: 0, drawn: [0, 0, 0] };
  for (const sg of segs) {
    if (t < sg.s) break;
    sg.fn(clamp((t - sg.s) / (sg.e - sg.s)), o);
  }
  strokes.forEach((p, i) => {
    p.style.strokeDashoffset = len[i] * (1 - o.drawn[i]);
    p.style.visibility = o.drawn[i] > 0 ? 'visible' : 'hidden';
  });
  dot.setAttribute('r', 2 * back(o.dot));
  pen.style.opacity = o.op;
  pen.setAttribute('transform', `translate(${o.x} ${o.y}) scale(${o.sc}) translate(-2 -2)`);
}

let t0, raf;
function tick(now) {
  const t = (now - t0) / 1000;
  render(Math.min(t, T));
  if (t < T) raf = requestAnimationFrame(tick);
}
function play() {
  cancelAnimationFrame(raf);
  render(0);
  t0 = performance.now();
  raf = requestAnimationFrame(tick);
}
svg.onclick = play;
play();
</script>
</body>
</html>
